# 야간 루프 설정. 시각은 모두 timezone 기준.

timezone = "Asia/Seoul"
work_start = "09:00"        # 이 시각에 사용자가 쓸 5시간 창은 비어 있어야 한다
work_end = "22:00"          # 루프는 이 시각 이후에만 시작한다
workdays = [0, 1, 2, 3, 4, 5, 6]  # 월=0 … 일=6. 주말에 근무하지 않으면 5, 6을 빼라

safety_margin_minutes = 5   # 모든 경계에서 이만큼 일찍 멈춘다
window_hours = 5            # 구독 세션 한도 창 길이
job_max_minutes = 90        # 작업 1건 최대 길이
min_job_minutes = 15        # 남은 시간이 이보다 짧으면 새 작업을 시작하지 않는다
usage_max_age_minutes = 10  # 작업 시작 판정에 쓰는 주간 사용률이 이보다 오래되면 다시 읽는다

[weekly]
# 2026-09-15 사용자 결정: 주간 사용률이 이 값 미만이면 루프가 자유롭게 쓰고,
# 이 값 이상이면 작업 1건을 시작할 때마다 승인 페이지에서 사용자 승인을 받는다.
approval_threshold = 0.70
approval_port = 8765        # Tailscale IP에만 바인딩한다

[loop]
target_passed = 10          # PIPELINE.md에 `통과(실증 대기)`가 이만큼 쌓이면 멈춘다
model = ""                  # 비우면 사용자 기본 모델
probe_model = "claude-haiku-4-5-20251001"  # 작업 전후로 한도 상태만 읽는 최소 호출
prompt_file = "harness/prompts/night-job.md"
