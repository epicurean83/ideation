[project]
name = "autoloop"
version = "0.1.0"
description = "신사업 아이데이션 자동 루프 — 주간 한도 70% 이상이면 작업마다 승인"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.152",
    "markdown-it-py>=3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
